<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <title>Продукт — SEYTA EOOD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --brand:#6b46c1; }
    body { margin:0; font-family: Arial, sans-serif; background:#f7f7f9; color:#222; }
    header { background:var(--brand); color:#fff; padding:16px; }
    main { max-width:900px; margin:24px auto; padding:0 16px; }
    .card { background:#fff; border-radius:14px; box-shadow:0 4px 14px rgba(0,0,0,.06); overflow:hidden; }
    .wrap { display:grid; grid-template-columns: 1fr 1.2fr; gap:18px; padding:18px; }
    img { width:100%; height:340px; object-fit:cover; background:#eee; border-radius:12px; }
    h1 { margin:0 0 8px; color:var(--brand); font-size:24px; }
    .muted { color:#666; margin-bottom:16px; }
    .price { font-size:22px; font-weight:800; margin:10px 0; }
    .btn { display:inline-block; background:var(--brand); color:#fff; text-decoration:none; border:0; padding:12px 16px; border-radius:10px; font-weight:700; cursor:pointer; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:14px; }
    a.back { color:var(--brand); text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back">← Назад към магазина</a>
  </header>

  <main>
    <div class="card">
      <div class="wrap">
        <div><img id="img" alt=""></div>
        <div>
          <h1 id="name"></h1>
          <div class="muted" id="category"></div>
          <div class="price" id="price"></div>
          <div id="size" class="muted"></div>
          <p id="desc"></p>
          <div class="row">
            <a class="btn" id="pay" target="_blank" rel="noopener">Плати с Viva Wallet</a>
            <a class="btn" href="https://pay.vivawallet.com/seyta-eood" target="_blank" rel="noopener">Общо плащане</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="products.js"></script>
  <script>
    function money(v, cur='BGN') {
      try { return new Intl.NumberFormat('bg-BG', { style:'currency', currency: cur }).format(v); }
      catch { return v + ' ' + cur; }
    }
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const p = PRODUCTS.find(x => String(x.id) === String(id));
    if (!p) {
      document.body.innerHTML = '<main><p style="padding:24px">Продуктът не е намерен. <a href="index.html">Обратно в магазина</a></p></main>';
    } else {
      document.title = p.name + ' — SEYTA';
      document.getElementById('name').textContent = p.name;
      document.getElementById('category').textContent = p.category;
      document.getElementById('price').textContent = money(p.price, p.currency);
      document.getElementById('size').textContent = p.size || '';
      document.getElementById('desc').textContent = p.description || '';
      document.getElementById('img').src = p.image;
      document.getElementById('img').alt = p.name;

      // Общ линк към Viva Wallet. Ако по-късно направиш отделни payment links, смени тук.
      const pay = document.getElementById('pay');
      pay.href = 'https://pay.vivawallet.com/seyta-eood';
      pay.textContent = 'Плати ' + p.name;
    }
  </script>
</body>
</html>
